[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gating-metrics"
version = "0.1.0"
description = "Measurement toolkit for state-gated co-expression coupling: layer couplings, exact covariance partition, platform contrast, closed-form power planning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Liu Yuanshui", email = "[to fill before release]" }]
keywords = ["co-expression", "single-cell", "gating", "ARDS", "inflammasome", "measurement"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.urls]
"OSF registration" = "https://doi.org/10.17605/OSF.IO/4TZH9"
"OSF project" = "https://osf.io/v8w5a"
Homepage = "[to fill: GitHub repo URL after creation]"

[tool.setuptools]
packages = ["gating_metrics"]
